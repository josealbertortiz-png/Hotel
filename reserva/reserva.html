    <h1>Hotel Rural La Encina</h1>
    <h1>Haga su reserva</h1>

    <fieldset>
        <legend>datos personales</legend>

            placeholder="Escriba su nombre completo" autofocus>

          <p> <label for=”Apll”>Apellidos</label>
            <input type="text" maxlength="100" name="apellidos" required
            placeholder="Escriba sus dos apellidos ">

               <input type="radio" value="D" id="Doble" name="Habitación">
         <label for="Triple">Triple</label>
              <input type="radio" value="T" id="Triple" name="Habitación">


    </p>    
    <p>
        <label for="numero de personas">Número de personas</label>
    <select name="numero de personas" id="numero de personas" >
        <option value="1" selected >1</option>
        <option value="2" selected >2</option>
        <option value="3" selected >3</option>
    
    </select>
    
    </p>
    <p> Llevo mascota <input type="checkbox" name="mascota" checked> 

    </p>
    <p>
        Fecha  de llegada <input type="date">
    </p>
    <p>
        Hora de llegada <input type="time">
    </p>
    
      <p>  <input type="submit" value="Enviar">

    </p>
        
</fieldset>
